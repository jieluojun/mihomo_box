# ============================================================
# Mihomo Box · OpenWrt 默认配置
#
# 安装完先看这里：把订阅加进来（或直接写 proxies / proxy-providers），
# 面板（http://路由器IP:55555）里也能改，两边改的是同一个文件。
#
# 常用改法：
#   · 加订阅：面板 →「配置」页 → 订阅管理；或手写 proxy-providers: 段
#   · 整机接管流量（推荐路由器用 TUN）：把下面 tun 段的 enable 改成 true
#     （需要 /dev/net/tun，装包时用 --install-tun 或 opkg install kmod-tun）
#   · 局域网直连：rules 里的 LAN 规则别删，否则内网设备之间会绕代理
# ============================================================

# HTTP / SOCKS / 混合端口（局域网设备可把网关或代理指向它）
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false

# 控制器：面板与命令行都通过它读写运行状态（保持 127.0.0.1 最安全）
external-controller: 127.0.0.1:9090

# 面板的「下载 / 更新 Geo 数据」与按域名分流都靠这几个文件；
# 首次使用可点面板上的按钮下载，或让 mihomo 自动拉取
geodata-mode: false
geo-auto-update: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

# 内核自带的 TUN 接管（路由器上通常就是它来接管整机流量）。
# 用不到就保持 enable: false；打开前确认 /dev/net/tun 存在。
tun:
  enable: false
  stack: system          # 路由器内核一般用 system；性能好且兼容性高
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

# 订阅示例（把 URL 换成你自己的；面板里也能加，加完会自动写回本文件）
# proxy-providers:
#   my-sub:
#     type: http
#     url: "https://example.com/subscribe?token=xxx"
#     interval: 3600
#     path: ./providers/my-sub.yaml
#     health-check: { enable: true, url: "https://www.gstatic.com/generate_204", interval: 300 }

proxies: []
proxy-groups: []

rules:
  # 局域网与保留地址一律直连：路由器上这条很关键
  - GEOIP,lan,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  # 还没配订阅/节点前，其余流量直连（配好后把最后一条改成你的策略组）
  - MATCH,DIRECT
