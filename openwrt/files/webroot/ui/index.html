<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<!-- 静态资源 URL 带版本戳 ?v=…：值在打包时由 build.sh 烘焙（__PANEL_VER__ 占位），
     每次刷入再由 customize.sh 现场重写为本次刷入指纹 —— 刷一次 URL 全变，
     浏览器/管理器 WebView 的 HTTP 缓存不可能再把上一版 JS/CSS 递上来。
     （meta http-equiv 缓存指令对 Chromium 子资源无效，单靠它兜不住 WebView 缓存。） -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mihomo Box</title>

<!-- ===== PWA：可安装到桌面 / 主屏 ===== -->
<link rel="manifest" href="manifest.webmanifest">
<!-- theme-color 决定浏览器状态栏/地址栏底色，必须与页面底色 --bg 一致。
     主题由 data-theme 属性控制（跟随系统/浅色/深色三档），不是 CSS 媒体查询，
     所以这里只放一个标签，由 applyTheme() 实时改写，避免与实际主题脱节。 -->
<meta name="theme-color" id="themeColor" content="#F5F6FA">
<!-- 首屏主题必须在外部 CSS 和 body 解析前同步完成。若等 app.js 的 DOMContentLoaded/boot，
     深色模式也会先按 :root 浅色变量绘制一帧，再切成深色，形成白闪。 -->
<script id="themeBoot">
(() => {
  let theme = 'auto';
  try { theme = localStorage.getItem('theme') || 'auto'; } catch (_) {}
  const systemDark = typeof matchMedia === 'function'
    && matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = theme === 'dark' || (theme === 'auto' && systemDark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('themeColor').setAttribute('content', dark ? '#0C0C0F' : '#F5F6FA');
})();
</script>
<meta name="application-name" content="Mihomo Box">
<!-- iOS 走私有 meta，不认 manifest -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mihomo Box">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png" type="image/png">

<link rel="stylesheet" href="css/style.css?v=20260925-2322">
</head>
<body>

<!-- ===== 应用框架 ===== -->
<div id="app">

  <!-- 大标题头 -->
  <header class="appbar" id="appbar">
    <button class="back-btn" id="backBtn" hidden aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="titles">
      <h1 id="pageTitle">主页</h1>
      <div class="subtitle" id="pageSubtitle">内核运行状态</div>
    </div>
    <!-- 配置源码：紧靠设置按钮左侧。原来在「工具」页里当一张折叠卡，现在整张搬进
         这个按钮打开的弹层（任何页面都能一键改源码/传配置）。 -->
    <button class="icon-btn" id="srcBtn" aria-label="配置源码" title="配置源码">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13.8 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.2z"/><path d="M13.8 3v5.2H19"/><path d="M10.7 12.7 9.1 14.4l1.6 1.7"/><path d="M13.3 12.7l1.6 1.7-1.6 1.7"/></svg>
    </button>
    <button class="icon-btn" id="modSettingsBtn" aria-label="模块设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="切换主题">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <!-- 页面容器 -->
  <main id="pages">
    <!-- 首屏静态骨架：零 JS 即可与顶栏/底栏同帧绘制，JS 就绪后无缝替换为真实内容 -->
    <section class="page" id="page-dashboard" data-title="主页" data-sub="内核运行状态">
      <!-- 与 renderDashboard 共用布局类：运行模式 → 状态/总开关 → 快捷操作 → 日志。
           占位文字只负责撑起真实行高；整块对辅助技术隐藏，按钮不可操作。 -->
      <div class="card home-sk" data-home-skeleton="mode" aria-hidden="true">
        <div class="card-head"><h3><span class="home-sk-text">运行模式</span></h3></div>
        <div class="seg" style="width:100%;display:flex">
          <button type="button" disabled style="flex:1">规则</button>
          <button type="button" disabled style="flex:1">全局</button>
          <button type="button" disabled style="flex:1">直连</button>
        </div>
      </div>
      <div class="card hero home-sk" data-home-skeleton="status" aria-hidden="true">
        <div class="hero-heading">
          <div class="hero-status-line">
            <span class="hero-status-label home-sk-text">运行中</span>
            <span class="dot"></span>
            <span class="badge g">PID 00000</span>
            <span class="badge b">CPU 0.0%</span>
            <span class="badge b">MEM 0.0 MiB</span>
          </div>
          <button type="button" disabled class="hsub hero-version"><span class="home-sk-text">liuran001 · 内核版本信息</span></button>
        </div>
        <div class="stats">
          <div class="stat"><div class="k">代理模式</div><div class="v">ebpf</div></div>
          <div class="stat"><div class="k">运行时长</div><div class="v">00:00:00</div></div>
          <div class="stat"><div class="k">混合端口</div><div class="v">7890</div></div>
        </div>
        <div class="big-toggle">
          <div class="lbl"><span class="home-sk-text">总开关</span><div style="font-size:12px;color:var(--text-3);font-weight:400"><span class="home-sk-text">关闭停止代理与接管</span></div></div>
          <div class="switch"></div>
        </div>
      </div>
      <div class="group-title home-sk" data-home-skeleton="actions-title" aria-hidden="true"><span class="home-sk-text">快捷操作</span></div>
      <div class="card home-sk" data-home-skeleton="actions" aria-hidden="true">
        <div class="btn-grid keep2">
          <button type="button" disabled class="btn">重启内核</button>
          <button type="button" disabled class="btn">校验配置</button>
          <button type="button" disabled class="btn">更新订阅</button>
          <button type="button" disabled class="btn">外部面板</button>
        </div>
      </div>
      <div class="group-title home-sk" data-home-skeleton="logs-title" aria-hidden="true"><span class="home-sk-text">运行日志</span></div>
      <div class="card home-sk" data-home-skeleton="logs" aria-hidden="true">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:13px;color:var(--text-3);flex:1"><span class="home-sk-text">mihomo 输出</span></span>
          <button type="button" disabled class="btn sm">复制</button>
          <button type="button" disabled class="btn sm">暂停</button>
          <button type="button" disabled class="btn sm">清空</button>
        </div>
        <div class="logbox dashboard-logbox"></div>
      </div>
    </section>
    <section class="page" id="page-config"    data-title="配置"   data-sub="全局 · DNS · 入站 · 代理 · 规则" hidden></section>
    <section class="page" id="page-proxies"   data-title="代理"   data-sub="代理组 · 节点" hidden></section>
    <section class="page" id="page-core"      data-title="内核管理" data-sub="内核下载与切换" hidden></section>
    <section class="page" id="page-tools"     data-title="工具"   data-sub="锚点 · 浏览器访问 · 备份 · 关于" hidden></section>

    <!-- 子页面 -->
        <section class="page sub" id="page-c-general" data-title="全局配置" data-sub="模式 / API / 日志 / Geo" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-dns" data-title="DNS" data-sub="dns · 域名解析与 fake-ip" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-sniff" data-title="域名嗅探" data-sub="sniffer · 域名恢复" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-inbound" data-title="入站" data-sub="代理端口 · TUN · listeners" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-f-proxies" data-title="出站代理" data-sub="proxies" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-f-subs" data-title="代理集合" data-sub="proxy-providers" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-f-groups" data-title="代理组" data-sub="proxy-groups" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-f-rules" data-title="路由规则" data-sub="rules" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-ruleproviders" data-title="规则集合" data-sub="rule-providers" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-subrules" data-title="子规则" data-sub="sub-rules" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-tunnels" data-title="流量隧道" data-sub="tunnels · TCP/UDP 转发" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-ntp" data-title="NTP" data-sub="ntp · 时间同步" data-parent="page-config" hidden></section>
    <section class="page sub" id="page-c-experimental" data-title="实验性配置" data-sub="experimental" data-parent="page-config" hidden></section>
  </main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-page="page-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 4.5 9v11h15V9z"/><path d="M9 20v-6h6v6"/></svg>
      <span>主页</span>
    </button>
    <button class="tab" data-page="page-proxies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="6" r="3"/><circle cx="17" cy="18" r="3"/><path d="M9.6 10.6 14.4 7.4M9.6 13.4l4.8 3.2"/></svg>
      <span>代理</span>
    </button>
    <button class="tab" data-page="page-config">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17.5 7H20M4 12h5.5M13 12h7M4 17h11.5M20 17h.01"/><circle cx="15.2" cy="7" r="2.4"/><circle cx="11" cy="12" r="2.4"/><circle cx="18" cy="17" r="2.4"/></svg>
      <span>配置</span>
    </button>
    <button class="tab" data-page="page-core">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12H5M19 12h2.2M6 2.8v2.2M18 2.8v2.2M6 19v2.2M18 19v2.2M2.8 6H5M19 6h2.2M2.8 18H5M19 18h2.2"/></svg>
      <span>内核</span>
    </button>
    <button class="tab" data-page="page-tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.6 4.6 0 0 0-6 6L3 18l3 3 5.7-5.7a4.6 4.6 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>
      <span>工具</span>
    </button>
  </nav>

  <!-- 底部弹层 -->
  <div class="sheet-mask" id="sheetMask" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-grabber"></div>
    <div class="sheet-content" id="sheetContent"></div>
    <!-- 底部固定操作条：表单过长时「取消 / 保存」始终可见 -->
    <div class="sheet-footer" id="sheetFooter" hidden></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- 回到顶部：滚动较深时右下角浮现（app.js updateToTop 控制显隐） -->
  <button class="to-top" id="toTopBtn" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5.6"/><path d="M5.6 12 12 5.6 18.4 12"/></svg>
  </button>
</div>

<script defer src="js/vendor/js-yaml.min.js?v=20260925-2322"></script>
<script type="module" src="js/app.js?v=20260925-2322"></script>
</body>
</html>
